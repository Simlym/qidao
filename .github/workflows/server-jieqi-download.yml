name: Linux 揭棋在线安装验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/engines/native-packages.json
      - scripts/test_public_server_jieqi.py
      - .github/workflows/server-jieqi-download.yml
      - backend/Dockerfile

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建正式清单安装器
        run: cargo build --locked --release --manifest-path src-tauri/engine-installer/Cargo.toml --bin qidao-engine-installer
      - name: 安装后端验证依赖
        run: pip install -r backend/requirements.txt
      - name: 真实公开下载、管理员接口启用与双边揭棋试算
        env:
          ENGINE_INSTALLER: ${{ github.workspace }}/src-tauri/engine-installer/target/release/qidao-engine-installer
        run: python scripts/test_public_server_jieqi.py
      - name: 构建实际部署镜像
        run: docker build --build-arg IMAGE_REGISTRY=docker.io -t qidao-jieqi-verification -f backend/Dockerfile .
      - name: 在部署镜像中验证揭棋下载安装及试算
        run: docker run --rm --volume "$PWD:/workspace:ro" --entrypoint python qidao-jieqi-verification /workspace/scripts/test_public_server_jieqi.py
