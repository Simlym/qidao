name: WASM 象棋候选构建
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 棋种
        type: choice
        options: [xiangqi, jieqi]
        default: xiangqi
      flavor:
        description: WASM 运行时
        type: choice
        options: [single, threads]
        default: single
permissions:
  contents: read
jobs:
  static-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 用真实前端 Docker 上下文构建
        run: docker build --build-arg IMAGE_REGISTRY=docker.io --build-arg NPM_REGISTRY=https://registry.npmjs.org -t qidao-static-test frontend
      - name: 验证静态下载与缺失附件行为
        run: |
          mkdir -p .engine-build/static-site/engines-20261107.3
          echo 'static-test' > .engine-build/static-site/engines-20261107.3/test.zip
          docker run -d --rm --name qidao-static-test --add-host backend:127.0.0.1 -p 127.0.0.1:8087:80 -v "$PWD/.engine-build/static-site:/srv/qidao/engine-releases:ro" qidao-static-test
          trap 'docker stop qidao-static-test' EXIT
          python - <<'PY'
          import time, urllib.request, urllib.error
          for attempt in range(20):
              try:
                  response = urllib.request.urlopen('http://127.0.0.1:8087/engine-releases/engines-20261107.3/test.zip')
                  break
              except OSError:
                  time.sleep(0.5)
          assert response.read() == b'static-test\n'
          assert response.headers['Access-Control-Allow-Origin'] == '*'
          assert response.headers['Cross-Origin-Resource-Policy'] == 'cross-origin'
          try:
              urllib.request.urlopen('http://127.0.0.1:8087/engine-releases/missing.zip')
              raise AssertionError('缺失文件不应返回应用首页')
          except urllib.error.HTTPError as error:
              assert error.code == 404
          PY
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 固定上游源码与工具镜像构建
        env:
          FLAVOR: ${{ inputs.flavor }}
          VARIANT: ${{ inputs.variant }}
        run: |
          if [ "$VARIANT" = jieqi ]; then
            python scripts/build_jieqi_wasm.py --output dist-engines/wasm-candidate
          else
            python scripts/build_wasm_engine.py --output dist-engines/wasm-candidate --flavor "$FLAVOR"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 准备真实浏览器验收
        working-directory: frontend
        run: |
          npm ci
          npm install --prefix ../.engine-build/browser-deps --no-save --package-lock=false playwright@1.56.1
          node ../.engine-build/browser-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: 浏览器真实安装、NNUE、坐标、停止和离线重启
        run: |
          node --test scripts/wasm/single-preamble.test.mjs
          node frontend/scripts/test-wasm-engine.mjs dist-engines/wasm-candidate
      - name: 保存未发布候选与完整源码材料
        uses: actions/upload-artifact@v4
        with:
          name: fairy-wasm-candidate
          path: |
            dist-engines/wasm-candidate/*.zip
            dist-engines/wasm-candidate/*.json
            dist-engines/wasm-candidate/*.txt
          retention-days: 14
